name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # A wrong bit layout produces a serial that looks perfectly plausible on
  # screen, so the decode engine is the one part a screenshot cannot vouch
  # for. It gets checked on every push.
  test:
    runs-on: ubuntu-latest
    name: decode engine
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Odograph
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: odograph-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
